# PIPELINE DEFINITION
# Name: rental-price-prediction-pipeline
# Inputs:
#    dataset_uri: str
# Outputs:
#    Output: float
components:
  comp-importer:
    executorLabel: exec-importer
    inputDefinitions:
      parameters:
        uri:
          parameterType: STRING
    outputDefinitions:
      artifacts:
        artifact:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
  comp-train-rental-price-model:
    executorLabel: exec-train-rental-price-model
    inputDefinitions:
      artifacts:
        dataset:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
    outputDefinitions:
      parameters:
        Output:
          parameterType: NUMBER_DOUBLE
deploymentSpec:
  executors:
    exec-importer:
      importer:
        artifactUri:
          runtimeParameter: uri
        typeSchema:
          schemaTitle: system.Dataset
          schemaVersion: 0.0.1
    exec-train-rental-price-model:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - train_rental_price_model
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'pandas==2.2.2'\
          \ 'numpy==2.1.1' 'scikit-learn==1.5.1'  &&  python3 -m pip install --quiet\
          \ --no-warn-script-location 'kfp==2.14.3' '--no-deps' 'typing-extensions>=3.7.4,<5;\
          \ python_version<\"3.9\"' && \"$0\" \"$@\"\n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef train_rental_price_model(dataset: dsl.Input[dsl.Dataset]) ->\
          \ float:\n    import numpy as np\n    import pandas as pd\n    from sklearn.linear_model\
          \ import LinearRegression\n    from sklearn.metrics import mean_squared_error\n\
          \    from sklearn.model_selection import train_test_split\n\n    frame =\
          \ pd.read_csv(dataset.path)\n    required = [\"rooms\", \"sqft\", \"price\"\
          ]\n    if not set(required).issubset(frame.columns) or len(frame) < 2:\n\
          \        raise ValueError(\"dataset requires rooms, sqft, price and at least\
          \ two rows\")\n    numeric = frame[required].apply(pd.to_numeric)\n    if\
          \ not np.isfinite(numeric.to_numpy(dtype=float)).all() or (numeric <= 0).any().any():\n\
          \        raise ValueError(\"dataset values must be finite and positive\"\
          )\n    frame[required] = numeric\n    features = frame[[\"rooms\", \"sqft\"\
          ]].values\n    target = frame[\"price\"].values\n\n    x_train, x_test,\
          \ y_train, y_test = train_test_split(\n        features,\n        target,\n\
          \        test_size=0.2,\n        random_state=42,\n    )\n\n    model =\
          \ LinearRegression().fit(x_train, y_train)\n    predictions = model.predict(x_test)\n\
          \    rmse = np.sqrt(mean_squared_error(y_test, predictions))\n    print(f\"\
          RMSE: {rmse:.2f}\")\n    return float(rmse)\n\n"
        image: python:3.10
pipelineInfo:
  name: rental-price-prediction-pipeline
root:
  dag:
    outputs:
      parameters:
        Output:
          valueFromParameter:
            outputParameterKey: Output
            producerSubtask: train-rental-price-model
    tasks:
      importer:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-importer
        inputs:
          parameters:
            uri:
              componentInputParameter: dataset_uri
        taskInfo:
          name: importer
      train-rental-price-model:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-train-rental-price-model
        dependentTasks:
        - importer
        inputs:
          artifacts:
            dataset:
              taskOutputArtifact:
                outputArtifactKey: artifact
                producerTask: importer
        taskInfo:
          name: train-rental-price-model
  inputDefinitions:
    parameters:
      dataset_uri:
        parameterType: STRING
  outputDefinitions:
    parameters:
      Output:
        parameterType: NUMBER_DOUBLE
schemaVersion: 2.1.0
sdkVersion: kfp-2.14.3
