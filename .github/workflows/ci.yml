name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: pip install -r requirements.txt pytest httpx
      - name: Run unit tests
        run: python -m pytest -q
      - name: Compile pipeline code
        run: python -m compileall main.py rental_mlops tests
      - name: Run model quality gate
        run: python main.py --no-compile --write-reports --report-dir outputs/reports
      - name: Write model artifact
        run: python main.py --no-compile --write-artifact --artifact-path outputs/model/rental-price-model.pkl
      - name: Write registry record
        run: python main.py --no-compile --write-registry-record --registry-path outputs/model/registry-record.json --artifact-path outputs/model/rental-price-model.pkl
      - name: Upload model reports
        uses: actions/upload-artifact@v4
        with:
          name: rental-price-reports
          path: outputs/reports
      - name: Upload packaged model metadata
        uses: actions/upload-artifact@v4
        with:
          name: rental-price-model
          path: outputs/model/
      - name: Compile Kubeflow pipeline
        run: python main.py --compile-only --output /tmp/rental_price_prediction_pipeline.yaml
      - name: Build and exercise artifact-backed API
        run: |
          set -euo pipefail
          docker build -t rental-price-api:test .
          container=$(docker run -d -p 127.0.0.1:8000:8000 \
            -e MODEL_ARTIFACT_PATH=/app/outputs/model/rental-price-model.pkl \
            rental-price-api:test uvicorn rental_mlops.serving:create_app \
            --factory --host 0.0.0.0 --port 8000)
          trap 'docker logs "$container"; docker rm -f "$container" >/dev/null' EXIT
          curl --fail --retry 15 --retry-delay 1 --retry-connrefused \
            http://127.0.0.1:8000/health > /tmp/health.json
          python -c "import json; h=json.load(open('/tmp/health.json')); assert h['source']=='artifact'; assert len(h['artifact_sha256'])==64"
          curl --fail -H 'Content-Type: application/json' \
            -d '{"rooms":3,"sqft":1100}' http://127.0.0.1:8000/predict > /tmp/prediction.json
          python -c "import json; assert json.load(open('/tmp/prediction.json'))['predicted_price'] > 0"
